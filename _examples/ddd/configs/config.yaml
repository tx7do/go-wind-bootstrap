app:
  id: ddd-demo
  name: ddd-example
  version: "1.0.0"
  env: development

server:
  http:
    addr: ":8080"

logger:
  type: zap
  zap:
    level: info
    format: json

database:
  sql:
    driver: go_sqlite
    source: ":memory:"
    migrate: true

cache:
  local:
    size: 10485760          # 10MB
    default_ttl_seconds: 300
