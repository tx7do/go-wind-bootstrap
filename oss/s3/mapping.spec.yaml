# 由 protoc-gen-fieldmap 生成字段映射，调整规则后重新生成（见 toolkit/protoc-gen-fieldmap）。
# tls 证书装载经 tlsutil 转换，保留在 s3.go 手工段。
output:
  file: oss/s3/mapping.gen.go
  package: s3
imports:
  s3Plugin: github.com/tx7do/go-wind-plugins/oss/s3
  v1: github.com/tx7do/go-wind-bootstrap/conf/gen/go/bootstrap/v1
message:
  proto: bootstrap/v1/storage.proto
  type: Storage.S3
  func: NewS3Config
  style: struct
  target_type: s3Plugin.Config
  fields:
    endpoint: { target: Endpoint }
    region: { target: Region }
    access_key: { target: AccessKey }
    secret_key: { target: SecretKey }
    token: { target: Token }
    use_ssl: { target: UseSsl }
    force_path_style: { target: ForcePathStyle }
    bucket: { target: Bucket }
    max_attempts: { target: MaxAttempts, cast: int }
    tls: { skip: true }
