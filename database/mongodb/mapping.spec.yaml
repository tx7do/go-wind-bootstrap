# 由 protoc-gen-fieldmap 生成字段映射，调整规则后重新生成（见 toolkit/protoc-gen-fieldmap）。
# username/password 合成为 WithCredentials 双参选项，保留在 client.go 手工段。
output:
  file: database/mongodb/mapping.gen.go
  package: mongodb
imports:
  mongodbCrud: github.com/tx7do/go-crud/mongodb
  v1: github.com/tx7do/go-wind-bootstrap/conf/gen/go/bootstrap/v1
message:
  proto: bootstrap/v1/database.proto
  type: Database.MongoDB
  func: MapMongoDBOptions
  target_type: mongodbCrud.Option
  target_qualifier: mongodbCrud
  fields:
    uri: { target: WithURI }
    database: { target: WithDatabase }
    username: { skip: true }
    password: { skip: true }
    timeout_seconds: { target: WithTimeout, cast: seconds }
    connect_timeout_seconds: { target: WithConnectTimeout, cast: seconds }
    server_selection_timeout_seconds: { target: WithServerSelectionTimeout, cast: seconds }
    heartbeat_interval_seconds: { target: WithHeartbeatInterval, cast: seconds }
    max_conn_idle_time_seconds: { target: WithMaxConnIdleTime, cast: seconds }
