  target_type: qdrantCrud.Option
  target_qualifier: qdrantCrud
  fields:
    host: { target: WithHost }
    port: { target: WithPort, cast: int, guard: positive }
    api_key: { target: WithAPIKey }
    use_tls: { skip: true }
    tls: { skip: true }
