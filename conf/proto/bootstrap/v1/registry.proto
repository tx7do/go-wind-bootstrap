syntax = "proto3";

package bootstrap.v1;

option go_package = "github.com/tx7do/go-wind-bootstrap/conf/gen/go/bootstrap/v1";

import "bootstrap/v1/tls.proto";

// Registry 描述服务注册中心配置。
message Registry {
  enum Type {
    TYPE_UNSPECIFIED = 0;

    CONSUL = 1;
    ETCD = 2;
    NACOS = 3;
    ZOOKEEPER = 4;
    POLARIS = 5;
    EUREKA = 6;
    KUBERNETES = 7;
    SERVICE_COMB = 8;
  }

  message Consul {
    string address = 1;
    string scheme = 2;
    string token = 3;
    // 健康检查间隔（秒）。
    int32 health_check_interval = 4;
    // 健康检查超时（秒）。
    int32 health_check_timeout = 5;
    // 是否启用健康检查。
    bool enable_health_check = 6;
    // 是否启用心跳。
    bool heartbeat = 7;
    // 服务注销临界时间（秒）。
    int32 deregister_critical_service_after = 8;
    string datacenter = 9;
    // ACL Token 文件路径。
    string token_file = 10;
    // 命名空间（Consul 企业版）。
    string namespace = 11;
    // 管理分区（Consul 企业版）。
    string partition = 12;
    // API 路径前缀。
    string path_prefix = 13;
    // HTTP Basic 认证。
    BasicAuth basic_auth = 14;
    // Watch 阻塞等待的最长时间（秒）。
    int32 wait_time = 15;
    // 服务发现超时（秒）。
    int32 discovery_timeout = 16;
    // TLS 配置。
    bootstrap.v1.TLS tls = 17;

    message BasicAuth {
      string username = 1;
      string password = 2;
    }
  }

  message Etcd {
    repeated string endpoints = 1;
    string username = 2;
    string password = 3;
    // 键前缀/命名空间。
    string prefix = 4;
    // 注册 TTL（秒）。
    int32 ttl = 5;
    // 最大重试次数。
    int32 max_retry = 6;
    // 连接超时（秒）。
    int32 dial_timeout = 7;
    // 集群成员自动同步间隔（秒），0 禁用。
    int32 auto_sync_interval = 8;
    // keepalive 探测间隔（秒）。
    int32 dial_keep_alive_time = 9;
    // keepalive 探测等待响应的超时（秒）。
    int32 dial_keep_alive_timeout = 10;
    // 拒绝连接过期集群。
    bool reject_old_cluster = 11;
    // 没有活动流时也允许发送 keepalive。
    bool permit_without_stream = 12;
    // TLS 配置。
    bootstrap.v1.TLS tls = 13;
  }

  message Nacos {
    repeated string server_addrs = 1;
    string namespace = 2;
    string group = 3;
    string cluster_name = 4;
    double weight = 5;
    // 配置前缀路径。
    string prefix = 6;
    // 默认服务类型。
    string default_kind = 7;
    // 网络协议：http、https，默认 http。
    string scheme = 8;
    // gRPC 长连接端口，默认 port+1000。
    uint64 grpc_port = 9;
    // 上下文路径。
    string context_path = 10;
    // 地址服务器 endpoint，用于获取服务端地址列表。
    string endpoint = 11;
    // 认证用户名。
    string username = 12;
    // 认证密码。
    string password = 13;
    // 请求服务端超时（毫秒）。
    int32 timeout_ms = 14;
    // 心跳间隔（毫秒）。
    int32 beat_interval_ms = 15;
    // 访问密钥（KMS）。
    string access_key = 16;
    // 安全密钥（KMS）。
    string secret_key = 17;
    // 启动时不读取本地缓存数据。
    bool not_load_cache_at_start = 18;
    // 服务列表为空时是否更新本地缓存。
    bool update_cache_when_empty = 19;
    // 请求服务端失败时禁用本地快照兜底。
    bool disable_use_snap_shot = 20;
    // 日志是否追加输出到标准输出。
    bool append_to_stdout = 21;
    // 是否开启异步订阅更新服务列表。
    bool async_update_service = 22;
    // TLS 配置（仅支持文件路径）。
    bootstrap.v1.TLS tls = 23;
    // 日志目录，默认当前路径。
    string log_dir = 24;
    // 日志等级：debug、info、warn、error，默认 info。
    string log_level = 25;
    // 缓存目录（服务信息持久化），默认当前路径。
    string cache_dir = 26;
    // 是否开启 KMS 加解密（阿里云）。
    bool open_kms = 27;
  }

  message Zookeeper {
    repeated string endpoints = 1;
    // 根路径/命名空间。
    string root_path = 2;
    int32 session_timeout = 3;
    // Digest ACL 用户名。
    string username = 4;
    // Digest ACL 密码。
    string password = 5;
  }

  message Polaris {
    string address = 1;
    string namespace = 2;
    string service = 3;
    string token = 4;
    // 服务协议。
    string protocol = 5;
    // 权重 (0~10000)。
    int32 weight = 6;
    // 优先级，值越小优先级越低。
    int32 priority = 7;
    // 是否健康。
    optional bool healthy = 8;
    // 是否隔离。
    optional bool isolate = 9;
    // 心跳 TTL（秒）。
    int32 ttl = 10;
    // 是否启用心跳，默认开启。
    optional bool heartbeat = 11;
    // 单次查询超时（毫秒）。
    int32 timeout = 12;
    // 重试次数。
    int32 retry_count = 13;
    // SDK 配置文件路径，默认使用系统默认配置。
    string config_file = 14;
  }

  message Eureka {
    repeated string endpoints = 1;
    string app_name = 2;
    // 心跳间隔（秒）。
    int32 heartbeat_interval = 3;
    // 服务列表刷新间隔（秒）。
    int32 refresh_interval = 4;
    // Eureka 路径前缀。
    string eureka_path = 5;
    // 请求失败重试次数，默认 endpoints 数量。
    int32 max_retry = 6;
  }

  message Kubernetes {
    string namespace = 1;
    // kubeconfig 文件路径，留空使用 ~/.kube/config 或集群内配置。
    string kubeconfig = 2;
    // 是否强制使用集群内（InCluster）配置。
    optional bool in_cluster = 3;
  }

  message ServiceComb {
    repeated string endpoints = 1;
    string app_id = 2;
    string service_name = 3;
    string version = 4;
    // 启用 SSL。
    bool enable_ssl = 5;
    // 请求超时（秒）。
    int32 timeout = 6;
    // 启用认证。
    bool enable_auth = 7;
    // 认证用户名。
    string username = 8;
    // 认证密码。
    string password = 9;
    // Token 有效期（秒）。
    int32 token_expiration = 10;
    // 输出详细日志。
    bool verbose = 11;
    // 压缩请求。
    bool compressed = 12;
    // TLS 配置。
    bootstrap.v1.TLS tls = 13;
  }

  string type = 1;

  optional Consul consul = 2;
  optional Etcd etcd = 3;
  optional Nacos nacos = 4;
  optional Zookeeper zookeeper = 5;
  optional Polaris polaris = 6;
  optional Eureka eureka = 7;
  optional Kubernetes kubernetes = 8;
  optional ServiceComb service_comb = 9;
}
