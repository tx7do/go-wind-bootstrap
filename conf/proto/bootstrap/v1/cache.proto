syntax = "proto3";

package bootstrap.v1;

option go_package = "github.com/tx7do/go-wind-bootstrap/conf/gen/go/bootstrap/v1";

import "bootstrap/v1/tls.proto";

// Cache 描述缓存配置。
message Cache {
  // 本地内存缓存（基于 FreeCache）。
  message Local {
    // 预分配缓存大小（字节），默认 256MB。
    int32 size = 1;
    // 默认 TTL（秒），0 表示永不过期。
    int32 default_ttl_seconds = 2;
  }

  // Redis 缓存。客户端模式（standalone/cluster/sentinel）按字段自动推断：
  // 配置 master_name 即 sentinel，配置 addrs（多于一个或配合 mode）即 cluster。
  message Redis {
    // 网络类型，默认 tcp。
    string network = 1;
    // Redis 服务地址（standalone 模式），如 "localhost:6379"。
    string addr = 2;
    // Redis 密码。
    string password = 3;
    // Redis 数据库编号，默认 0。
    int32 db = 4;
    // 用户名（Redis 6 ACL）。
    string username = 5;
    // TLS 配置。
    bootstrap.v1.TLS tls = 6;
    // 客户端模式：standalone、cluster、sentinel，默认 standalone。
    string mode = 7;
    // Sentinel 主节点名称（mode=sentinel 时必填）。
    string master_name = 8;
    // 服务端地址列表（mode=cluster/sentinel 时使用）。
    repeated string addrs = 9;
    // Sentinel 登录用户名。
    string sentinel_username = 10;
    // Sentinel 登录密码。
    string sentinel_password = 11;

    // 连接超时（秒）。
    int32 dial_timeout = 50;
    // 读取超时（秒）。
    int32 read_timeout = 51;
    // 写入超时（秒）。
    int32 write_timeout = 52;
    // 连接池获取连接超时（秒）。
    int32 pool_timeout = 53;
    // 连接最大空闲时间（秒）。
    int32 conn_max_idle_time = 54;
    // 连接最大存活时间（秒）。
    int32 conn_max_lifetime = 55;
    // 重试最小退避（毫秒）。
    int32 min_retry_backoff_ms = 56;
    // 重试最大退避（毫秒）。
    int32 max_retry_backoff_ms = 57;

    // 连接池大小。
    optional int32 pool_size = 60;
    // 连接池最小空闲连接数。
    optional int32 min_idle_conns = 61;
    // 命令失败最大重试次数。
    optional int32 max_retries = 62;

    // 键前缀，用于命名空间隔离。
    string key_prefix = 100;
  }

  optional Local local = 1;
  optional Redis redis = 2;
}
