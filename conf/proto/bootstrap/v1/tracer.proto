syntax = "proto3";

package bootstrap.v1;

option go_package = "github.com/tx7do/go-wind-bootstrap/conf/gen/go/bootstrap/v1";

// Tracer 描述分布式追踪配置。
message Tracer {
  enum Type {
    TYPE_UNSPECIFIED = 0;

    OTLP = 1;
  }

  message Otlp {
    // OTLP Collector 端点地址。
    string endpoint = 1;
    // 是否使用 insecure 连接。
    bool insecure = 2;
    // Headers。
    map<string, string> headers = 3;
    // 采样策略：always_on / always_off / trace_id_ratio / parent_based。
    string sampler = 4;
    // trace_id_ratio 模式下的采样比率 (0.0 ~ 1.0)。
    double sample_ratio = 5;
    // 使用 HTTP（collector 的 http 端口）而非 gRPC 上报。
    bool use_http = 6;
    // 批处理延迟（毫秒），默认 5000。
    int32 batch_timeout_ms = 7;
    // 导出请求超时（毫秒），默认 5000。
    int32 export_timeout_ms = 8;
  }

  string type = 1;

  // 追踪类型：otlp。
  optional Otlp otlp = 2;
}
